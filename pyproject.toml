# Tool configuration for the UBC-FRESH dev workflow in the GNN model instance.
# `scripts/` is workflow tooling and carries the strict gates. `pipeline/` holds the
# data-pipeline entry points and is validated by execution, not by these gates. Each
# gate configured here is also a check in the green dashboard (scripts/dashboard.py).

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]
extend-exclude = ["tmp", "_build", "pipeline"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"templates/project/tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts"
files = ["scripts", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
