# GNN public-route proxy: Quatsino Sound -> Ladysmith Harbour.
#
# Public route evidence:
#   https://www.seaspan.com/stories/log-barging-101/
# Historical terminal evidence:
#   TFL 6 Annual Reports 1999/2000 (Quatsino Dryland Log Sort; Seaspan barging;
#   Pacific Towing; southern mills including Ladysmith).
#
# This is a diagnostic proxy. Barge capacity, rates, road legs, terminal
# handling, and fleet size are assumptions, not current quotes or confirmation
# of current operations. The water leg is an approximate waypoint distance,
# not a navigation route.
name: "GNN public-route proxy: Quatsino Sound to Ladysmith Harbour"
num_days: 8
schema_version: 1.1.0
start_date: 2026-11-02
data:
  blocks: blocks.csv
  machines: machines.csv
  landings: landings.csv
  calendar: calendar.csv
  prod_rates: production_rates.csv
hauling:
  planning_horizon_days: 8
  start_day: 1
  log_sorts:
    - id: coastal_mixed
      sorted: true
      description: Proxy coastal mixed sawlogs
  contractors:
    - id: gnn_proxy
      name: GNN public-route proxy contractor
      preferred_daily_truckloads: 8
  truck_types:
    - id: highway
      capacity_m3: 45
      fixed_cost: 120.0
      variable_cost_per_minute: 1.20
      overtime_cost_per_minute: 1.80
      can_carry_sorted: true
      can_carry_unsorted: true
  trucks:
    - id: gnn_h1
      contractor_id: gnn_proxy
      truck_type_id: highway
    - id: gnn_h2
      contractor_id: gnn_proxy
      truck_type_id: highway
  depots:
    - id: north_island_depot
      name: North Island proxy depot
  depot_legs:
    - {depot_id: north_island_depot, location_id: gnn_quatsino, truck_type_id: highway, travel_minutes: 60}
    - {depot_id: north_island_depot, location_id: quatsino, truck_type_id: highway, travel_minutes: 45}
    - {depot_id: north_island_depot, location_id: ladysmith, truck_type_id: highway, travel_minutes: 20}
    - {depot_id: north_island_depot, location_id: ladysmith_yard, truck_type_id: highway, travel_minutes: 15}
  barge_types:
    - id: seaspan_proxy_barge
      capacity_m3: 10000
      fixed_cost: 1500.0
      variable_cost_per_minute: 5.0
      overtime_cost_per_minute: 7.5
      load_minutes: 30
      unload_minutes: 30
      can_carry_sorted: true
      can_carry_unsorted: true
  barges:
    - id: gnn_b1
      contractor_id: gnn_proxy
      barge_type_id: seaspan_proxy_barge
  ports:
    - id: quatsino
      name: Quatsino Sound log-load proxy
      storage_m3: 100000
      initial_inventory_m3: 0
      handling_minutes_per_trip: 30
      handling_cost_per_trip: 150
      daily_handling_m3: 20000
    - id: ladysmith
      name: Ladysmith Harbour log-dump proxy
      storage_m3: 100000
      initial_inventory_m3: 0
      handling_minutes_per_trip: 45
      handling_cost_per_trip: 180
      daily_handling_m3: 20000
  water_arcs:
    - id: quatsino_ladysmith
      origin_port_id: quatsino
      destination_port_id: ladysmith
      barge_type_id: seaspan_proxy_barge
      travel_minutes: 1910
      distance_km: 589
      return_travel_minutes: 1910
      load_minutes: 30
      unload_minutes: 30
  port_legs:
    - {port_id: quatsino, location_id: gnn_quatsino, side: origin, truck_type_id: highway, travel_minutes: 60, distance_km: 50, return_travel_minutes: 60}
    - {port_id: ladysmith, location_id: ladysmith_yard, side: destination, truck_type_id: highway, travel_minutes: 20, distance_km: 10, return_travel_minutes: 20}
  marine_routes:
    - id: quatsino_ladysmith_yard
      block_id: gnn_quatsino
      yard_id: ladysmith_yard
      origin_port_id: quatsino
      destination_port_id: ladysmith
      water_arc_id: quatsino_ladysmith
      contractor_id: gnn_proxy
      truck_type_id: highway
  sort_yards:
    - id: ladysmith_yard
      facility_id: ladysmith_sort
      unsorted_storage_m3: 100000
      sorted_processing_m3_per_day: 20000
      unsorted_processing_m3_per_day: 20000
      total_processing_m3_per_day: 20000
      initial_unsorted_inventory_m3: 0
      initial_water_inventory_m3: 0
  loader_locations:
    - {loader_id: loader_gnn, location_id: gnn_quatsino, location_kind: pickup, service_minutes: 20}
    - {loader_id: loader_quatsino, location_id: quatsino, location_kind: port, service_minutes: 35}
    - {loader_id: loader_ladysmith, location_id: ladysmith, location_kind: port, service_minutes: 45}
    - {loader_id: loader_yard, location_id: ladysmith_yard, location_kind: delivery, service_minutes: 25}
  supply:
    - {block_id: gnn_quatsino, log_sort_id: coastal_mixed, sorted_m3: 10000, unsorted_m3: 0}
  demand:
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 1, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 2, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 3, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 4, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 5, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 6, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 7, volume_m3: 0}
    - {yard_id: ladysmith_yard, log_sort_id: coastal_mixed, day: 8, volume_m3: 10000}
  haul_arcs: []
  contractor_blocks:
    - {contractor_id: gnn_proxy, block_id: gnn_quatsino}
  driver_policy:
    regular_minutes: 510
    max_overtime_minutes: 150
    overtime_violation_penalty_per_minute: 10
  roadside_inventory_penalty_per_m3: 100
  port_inventory_penalty_per_m3: 100
  default_loader_service_minutes: 20
